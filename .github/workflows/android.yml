# Builds the Android app in the cloud, so nobody needs Android Studio to try it.
# Push to GitHub (or press "Run workflow" on the Actions tab); the APK appears under the run's "Artifacts".
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Build the web player (it is the app's content)
        run: npm run build -w @tome/player-web
        env:
          VITE_FREE_PREVIEW: ${{ vars.VITE_FREE_PREVIEW }}

      - name: Copy it into the Android project
        working-directory: packages/player-web
        run: npx cap sync android

      - name: Build the APK
        working-directory: packages/player-web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tome-android-debug
          path: packages/player-web/android/app/build/outputs/apk/debug/app-debug.apk
